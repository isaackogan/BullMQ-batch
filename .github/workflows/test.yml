name: "Test"

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_call:

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'

            -   name: Install pnpm
                run: npm install -g pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Typecheck
                run: pnpm run typecheck

            -   name: Build
                run: pnpm run build

            -   name: Test
                run: pnpm test
                env:
                    REDIS_URL: redis://localhost:6379
