name: "Release: Build & Publish to npm"

on:
    workflow_dispatch:
        inputs:
            bump:
                description: 'Version bump type (use "manual" to set an exact version below)'
                type: choice
                options:
                    - patch
                    - minor
                    - major
                    - manual
                default: patch
            manual_version:
                description: 'Exact version when bump = manual (e.g. 0.2.0-alpha1). Ignored otherwise.'
                type: string
                required: false
                default: ''

permissions:
    contents: write
    id-token: write

jobs:
    test:
        uses: ./.github/workflows/test.yml

    release:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-node@v4
                with:
                    node-version: '24'
                    registry-url: 'https://registry.npmjs.org'

            -   name: Ensure npm supports trusted publishing
                run: npm install -g npm@11

            -   name: Install pnpm
                run: npm install -g pnpm

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Bump version
                run: |
                    if [ "${{ inputs.bump }}" = "manual" ]; then
                      if [ -z "${{ inputs.manual_version }}" ]; then
                        echo "::error::manual_version is required when bump = manual"
                        exit 1
                      fi
                      npm version "${{ inputs.manual_version }}" --no-git-tag-version --allow-same-version
                    else
                      npm version "${{ inputs.bump }}" --no-git-tag-version
                    fi

            -   name: Read new version
                id: version
                run: |
                    VERSION=$(node -p "require('./package.json').version")
                    TAG=$(node -p "
                        const v = require('./package.json').version;
                        const m = v.match(/-([a-z]+)/i);
                        m ? m[1].toLowerCase() : 'latest';
                    ")
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "tag=$TAG" >> $GITHUB_OUTPUT
                    echo "Publishing $VERSION under dist-tag '$TAG'"

            -   name: Build
                run: pnpm run build

            -   name: Publish to npm (trusted publishing)
                # Uses npm's OIDC trusted publishing — no NODE_AUTH_TOKEN/NPM_TOKEN is set.
                # Requires a trusted publisher to be configured for this package on npmjs.com
                # pointing at this repo and workflow. --provenance attaches a provenance
                # attestation, --access public is required for unscoped or new packages.
                run: npm publish --provenance --access public --tag "${{ steps.version.outputs.tag }}"

            -   name: Commit release
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add package.json pnpm-lock.yaml 2>/dev/null || true
                    if git diff --cached --quiet; then
                      echo "No release-related changes to commit (version already at ${{ steps.version.outputs.version }})"
                    else
                      git commit -m "chore: release bullmq-batch v${{ steps.version.outputs.version }} [skip ci]"
                      git push
                    fi

            -   name: Create git tag
                run: |
                    TAG="v${{ steps.version.outputs.version }}"
                    if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
                      echo "Local tag $TAG already exists, skipping tag creation"
                    elif git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
                      echo "Remote tag $TAG already exists on origin, skipping push"
                    else
                      git tag "$TAG"
                      git push origin "$TAG"
                    fi

            -   name: Summary
                run: echo "### Published bullmq-batch@${{ steps.version.outputs.version }} under dist-tag \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
